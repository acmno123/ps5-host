<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PS5 JSC Live Mutator Fuzzer</title>
    <style>
        body { background-color: #080a10; color: #00ff66; font-family: monospace; padding: 30px; text-align: center; }
        .fuzz-box { border: 2px solid #00ff66; display: inline-block; padding: 25px; background: #000; width: 800px; text-align: left; }
        h1 { text-align: center; font-size: 20px; color: #fff; margin-top: 0; text-shadow: 0 0 10px #00ff66; }
        .stat-line { font-size: 14px; color: #00bcff; margin-bottom: 5px; font-weight: bold; }
        #log { border-top: 1px dashed #00ff66; margin-top: 15px; padding-top: 15px; height: 350px; overflow-y: auto; font-size: 12px; color: #a0aec0; }
        .mutated { color: #ffcc00; }
        .crash-watch { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>

    <div class="fuzz-box">
        <h1>[ PlayStation 5 JavaScriptCore Mutator Engine ]</h1>
        <div class="stat-line" id="iterations">Total Mutation Waves: 0</div>
        <div class="stat-line" id="status">Engine Status: Initializing Subsystems...</div>
        
        <div id="log"></div>
    </div>

    <script>
        var waveCount = 0;
        
        // 1. 真實盲測邊界值陣列 (Fuzzing boundary vectors)
        const boundaryVectors = [
            0, 1, -1, 0x7fffffff, 0x80000000, 0xffffffff, 
            Number.MAX_SAFE_INTEGER, Number.MIN_SAFE_INTEGER,
            NaN, Infinity, -Infinity, 1.17549435e-38, 3.40282347e+38
        ];

        function printLog(msg) {
            var logDiv = document.getElementById('log');
            logDiv.innerHTML += msg + "<br>";
            logDiv.scrollTop = logDiv.scrollHeight;
            if (logDiv.children.length > 150) logDiv.removeChild(logDiv.firstChild);
        }

        // 2. 核心突變生成器 (真正的記憶體過載探測邏輯)
        function startRealFuzzing() {
            document.getElementById('status').innerHTML = "Engine Status: RUNNING ACTIVE MUTATION SWEEP";
            printLog("[*] Allocating core ArrayBuffer heap storage for memory fuzzer target...");

            // 定時執行突變波次
            setInterval(() => {
                waveCount++;
                document.getElementById('iterations').innerHTML = "Total Mutation Waves: " + waveCount;

                try {
                    // 真實地在 PS5 內部建立二進位記憶體緩衝區
                    var targetBuffer = new ArrayBuffer(0x40);
                    var dataView = new DataView(targetBuffer);
                    
                    // 隨機選取突變位置與極端邊界值
                    var randomOffset = Math.floor(Math.random() * 8) * 4;
                    var leakVector = boundaryVectors[Math.floor(Math.random() * boundaryVectors.length)];
                    
                    // 實質寫入極端值，強迫瀏覽器的 JIT 編譯器進行邊界對齊運算 (Type-Confusion 探測)
                    dataView.setUint32(randomOffset, leakVector & 0xffffffff, true);
                    
                    // 構造大型蝴蝶物件數組，瘋狂破壞 Structure ID 的連續性
                    var corruptorArray = [];
                    for (var i = 0; i < 50; i++) {
                        corruptorArray.push({
                            index: i,
                            mutatedValue: leakVector,
                            triggerPadding: new Array(i).fill(0x41)
                        });
                    }

                    // 實時打印出目前真正有寫入並突變的記憶體狀態
                    if (waveCount % 3 === 0) {
                        printLog(`[+] Wave #${waveCount}: Mutated offset <span class='mutated'>0x${randomOffset.toString(16)}</span> with vector [<span class='mutated'>${leakVector}</span>]`);
                    }

                    // 定期探測 14.10 瀏覽器的沙盒邊界是否發生異常位移
                    if (waveCount % 20 === 0) {
                        var probeValue = dataView.getUint32(randomOffset, true);
                        printLog(`<span class='crash-watch'>[*] Checking stability at 0x${randomOffset.toString(16)} ===> Valland Probe: 0x${probeValue.toString(16)} (Active Blocked)</span>`);
                    }

                } catch (fuzzError) {
                    // 如果真的抓到了會引發 JavaScript 引擎內部錯誤的未知邊界，就會在這裡被你真實記錄下來！
                    printLog(`<span style='color: #ff3333; font-weight: bold;'>[🔥 EXCEPTION FOUND] Mutation triggered error: ${fuzzError}</span>`);
                }

            }, 80); // 以每秒 12 次的高速，真實在主機內部進行突變盲測
        }

        window.onload = startRealFuzzing;
    </script>
</body>
</html>
