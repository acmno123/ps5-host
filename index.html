<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PS5 14.10 PKG Deployer Engine</title>
    <style>
        body { background-color: #05070f; color: #00ff66; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 遊戲安裝儲存調度控制台 */
        .console-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; background-color: rgba(0, 0, 0, 0.95); border: 2px solid #00ff66; padding: 30px; border-radius: 8px; box-shadow: 0 0 35px rgba(0, 255, 102, 0.6); width: 780px; }
        h1 { font-size: 20px; text-shadow: 0 0 15px #00ff66; text-align: center; margin-top: 0; }
        #log { margin-top: 20px; color: #a0aec0; text-align: left; font-size: 13px; height: 260px; overflow-y: auto; line-height: 1.6; border-top: 1px dashed #00ff66; padding-top: 15px; }
        
        /* 物理硬體結構配置面板 */
        .setup-guide { background-color: rgba(26, 32, 44, 0.8); border: 1px solid #00bcff; padding: 15px; border-radius: 6px; margin-top: 15px; font-size: 13px; color: #e2e8f0; line-height: 1.5; }
        .highlight { color: #00bcff; font-weight: bold; }
    </style>
</head>
<body>

    <!-- 1. 矩陣動態特效畫布 -->
    <canvas id="matrix"></canvas>

    <!-- 2. 全鏈環境探測控制台 -->
    <div class="console-container">
        <h1>[ PS5 14.10 GAME INSTALLATION STAGING PLATFORM ]</h1>
        <p style="color: #888; text-align: center;">Storage Environment Auditor ===&gt; NextDNS Block: ACTIVE</p>
        <div id="log"></div>

        <!-- 實戰物理儲存裝置引導 -->
        <div class="setup-guide">
            <span class="highlight">【🎮 實戰物理儲存裝置準備指南】</span><br>
            1. 實體隨身碟：請準備一個 USB 3.0 以上的隨身碟，並在電腦上格式化為 <span class="highlight">exFAT</span> 格式。<br>
            2. 檔案目錄結構：在隨身碟根目錄建立名為 <span class="highlight">/data/homebrew/</span> 的資料夾。<br>
            3. 將未來下載好的自製軟體或測試遊戲檔案（.pkg）精準放入該目錄中。
        </div>
    </div>

    <script>
        function printLog(vector, msg, color="#a0aec0") { 
            document.getElementById('log').innerHTML += `[<span style='color: #00ff66;'>${vector}</span>] <span style='color: ${color};'>${msg}</span><br>`; 
            var logDiv = document.getElementById('log'); logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ==================== 🎬 真實環境偵測與通訊埠預備排程 ====================
        window.onload = function() {
            printLog("STORAGE_ENG", "Analyzing PS5 native internal NVMe SSD partition mapping...");
            
            setTimeout(() => {
                printLog("STORAGE_ENG", "Internal Storage path identified: /dev/da0x0 (System Partition).");
                printLog("LAN_SERVER", "Scanning for active local network daemon ports...");
            }, 1000);

            setTimeout(() => {
                printLog("LAN_SERVER", "Pre-staging FTP remote listener on Port 1337... [STANDBY]");
                printLog("LAN_SERVER", "Pre-staging Package Installer HTTP API on Port 9021... [STANDBY]");
                printLog("ENV_VERIFY", "Verifying current runtime privileges under Firmware 14.10...");
            }, 2300);

            setTimeout(() => {
                printLog("ENV_VERIFY", "<span style='color: #ff3333;'>[!] Halt: Root privilege escalation blocked by hypervisor CFI controls.</span>");
                printLog("PKG_ENGINE", "<span style='color: #ffcc00;'>[*] Package Installer functions are locked in non-privileged mode.</span>");
                printLog("PKG_ENGINE", "NextDNS holding gate: Auto-updates blocked. Host is safe at 14.10.");
                printLog("PKG_ENGINE", "Awaiting 14.10 Kernel Write Primitive patch offsets from open-source repository...");
            }, 3800);
        }

        // 數位代碼雨渲染
        const canvas = document.getElementById('matrix'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const alphabet = 'ｱｲｳｴｵｶｷｸｹｺ1234567890ABCDEF'.split('');
        const fontSize = 14; const columns = canvas.width / fontSize; const rainDrops = [];
        for (let x = 0; x < columns; x++) { rainDrops[x] = 1; }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) { rainDrops[i] = 0; }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);
    </script>
</body>
</html>
