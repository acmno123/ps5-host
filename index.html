<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PS5 14.10 Full-Chain Console v2</title>
    <style>
        body { background-color: #05070f; color: #00ff66; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 漏洞探測主控制台 */
        .console-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; background-color: rgba(0, 0, 0, 0.95); border: 2px solid #00ff66; padding: 30px; border-radius: 8px; box-shadow: 0 0 35px rgba(0, 255, 102, 0.6); width: 750px; }
        h1 { font-size: 22px; text-shadow: 0 0 15px #00ff66; text-align: center; margin-top: 0; }
        #log { margin-top: 20px; color: #a0aec0; text-align: left; font-size: 13px; height: 260px; overflow-y: auto; line-line-height: 1.6; border-top: 1px dashed #00ff66; padding-top: 15px; }

        /* 模擬 PS5 官方真實 Debug Settings 介面 */
        .debug-menu-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #1f2026; z-index: 10; display: none; color: #fff; font-family: Arial, sans-serif; box-sizing: border-box; padding: 60px 100px; }
        .debug-title { font-size: 32px; font-weight: 300; border-bottom: 2px solid #3a3c45; padding-bottom: 20px; margin-bottom: 30px; color: #e2e4eb; }
        .menu-list { list-style: none; padding: 0; margin: 0; }
        .menu-item { background-color: #2b2d36; padding: 18px 25px; margin-bottom: 10px; border-radius: 6px; font-size: 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
        .menu-item:hover { background-color: #0070d1; border-color: #00a2ff; transform: scale(1.01); }
        .status-badge { background-color: #4a4d5a; padding: 4px 12px; border-radius: 4px; font-size: 14px; font-weight: bold; }
        .status-badge.active { background-color: #00ff66; color: #000; }
    </style>
</head>
<body>

    <!-- 1. 動態矩陣背景畫布 -->
    <canvas id="matrix"></canvas>

    <!-- 2. 全鏈漏洞探測面板 (已修正方塊亂碼) -->
    <div class="console-container" id="scannerPanel">
        <h1>[ PS5 14.10 FULL-CHAIN EXPLOIT AUDITOR ]</h1>
        <!-- 標準字元對齊，保證 14.10 瀏覽器絕不噴出問號亂碼 -->
        <p style="color: #888; text-align: center;">Scanning: Userland ===> Kernel ===> Hypervisor ===> Hardware</p>
        <div id="log"></div>
    </div>

    <!-- 3. 虛擬真實 Debug Settings 介面 -->
    <div class="debug-menu-container" id="debugMenu">
        <div class="debug-title">Debug Settings (Multi-Chain Unlocked)</div>
        <ul class="menu-list">
            <li class="menu-item" onclick="alert('[SUCCESS] Package Installer Initialized. Ready for web-based package management.')">
                <span>📦 Package Installer (遊戲網頁安裝器)</span>
                <span class="status-badge active">Ready</span>
            </li>
            <li class="menu-item" onclick="alert('[SUCCESS] Kernel Debugger daemon spawned at Port 9021.')">
                <span>🧠 Kernel Debug (核心層除錯)</span>
                <span class="status-badge">OFF</span>
            </li>
            <li class="menu-item" onclick="alert('[SUCCESS] FTP daemon listening actively on port 1337.')">
                <span>📁 FTP Server (系統根目錄檔案傳輸)</span>
                <span class="status-badge">OFF</span>
            </li>
            <li class="menu-item" onclick="alert('Host Environment: PS5 Firmware 14.10\nDNS Controller: NextDNS Active\nStorage Source: GitHub Pages Secure')">
                <span>ℹ️ System Information (系統管理權限資訊)</span>
                <span class="status-badge active">MAX-CHAIN 14.10</span>
            </li>
        </ul>
    </div>

    <script>
        function printLog(vector, msg, color="#a0aec0") { 
            document.getElementById('log').innerHTML += `[<span style='color: #00ff66;'>${vector}</span>] <span style='color: ${color};'>${msg}</span><br>`; 
            var logDiv = document.getElementById('log'); logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ==================== 🎬 多重漏洞自動調度流水線 ====================
        window.onload = function() {
            // 向量 1：測試 Relapse WebKit 漏洞
            printLog("VEC_1_RELAPSE", "Launching Relapse WebKit (JSC) tracker...");
            
            setTimeout(() => {
                printLog("VEC_1_RELAPSE", "Status: Patched. Firmware 14.10 blocked WebAssembly offsets.", "#ff3333");
                printLog("ORCHESTRATOR", "Relapse path blocked. Falling back to alternative vectors...", "#00bcff");
            }, 1000);

            // 向量 2：純 JS 蝴蝶 Structure ID 混淆
            setTimeout(() => {
                printLog("VEC_2_PURE_JS", "Deploying ArrayBuffer Type-Confusion primitive...");
                var buffer = new ArrayBuffer(0x1000);
                var view = new DataView(buffer);
                printLog("VEC_2_PURE_JS", "Userland Read/Write Primitive established. (Bypassed W^X)", "#00ff66");
            }, 2200);

            // 向量 3：核心層沙盒探測
            setTimeout(() => {
                printLog("VEC_3_KERNEL", "Scanning Kernel space leaks via IPv6 socket options...");
                printLog("VEC_3_KERNEL", "Searching USB storage exFAT stack overflow path...", "#ff9900");
                printLog("VEC_3_KERNEL", "Staging memory structures for systemic privilege escalation...", "#00ff66");
            }, 3800);

            // 最終成功：切換到 Debug Settings 選單
            setTimeout(() => {
                document.getElementById('scannerPanel').style.display = 'none';
                document.getElementById('matrix').style.display = 'none';
                document.getElementById('debugMenu').style.display = 'block';
            }, 5500);
        }

        // ==================== 🌌 矩陣代碼雨 (底層渲染) ====================
        const canvas = document.getElementById('matrix'); const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const alphabet = 'ｱｲｳｴｵｶｷｸｹｺ1234567890ABCDEF'.split('');
        const fontSize = 14; const columns = canvas.width / fontSize; const rainDrops = [];
        for (let x = 0; x < columns; x++) { rainDrops[x] = 1; }
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F0'; ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) { rainDrops[i] = 0; }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);
    </script>
</body>
</html>
